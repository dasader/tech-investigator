services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: techspec
      POSTGRES_PASSWORD: techspec
      POSTGRES_DB: techspec
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8017:8000"
    env_file: .env
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "8098:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
